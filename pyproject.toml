[project]
name = "stock-eda"
version = "0.1.0"
description = "Modular stock exploratory data analysis tool"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.36",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "ipywidgets>=8.1.0",
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
    "scipy>=1.15.3",
    "alpaca-py>=0.43.2",
    "python-dotenv>=1.2.1",
    "polars>=1.36.1",
    "pyarrow>=22.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strategies"]
